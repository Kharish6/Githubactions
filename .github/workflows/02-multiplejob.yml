name: multiple-job-workflow
on: 
    push:
        branches: [main]

jobs: 
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: run a command
              run: echo "Running first job"
    second-job:
        runs-on: ubuntu-latest
        steps:
            - name: run a command
              run: echo "Running second job"