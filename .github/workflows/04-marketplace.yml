name: marketplace-workflow
on:
    push: 
        branches: ["*"]
jobs:
    run-application:
        runs-on: ubuntu-latest
        steps:
            # 1. Bring the code into this specific virtual machine
            - name: checkout the code
              uses: actions/checkout@v3

            # 2. Setup the Node.js environment
            - name: Run the app in Node.js
              uses: actions/setup-node@v3
              with: 
                node-version: "18"

            # 3. Now Node can find your index.js file
            - name: Run node index.js
              run: node index.js
