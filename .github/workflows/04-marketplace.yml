name: marketplace-workflow
on:
    push: 
        branches: ["*"]
jobs:
    code-checkout:
        runs-on: ubuntu-latest
        steps:
            - name: checkout the code
              uses: actions/checkout@v3
    run-application:
        runs-on: ubuntu-latest
        needs: code-checkout
        steps:
            - name: Run the app in Node.js
              uses: actions/setup-node@v3
              with: 
                node-version: "18"
            - run: node index.js
