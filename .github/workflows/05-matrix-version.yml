name: matrix-version-workflow
on:
    push: 
        branches: ["*"]
jobs:
    run-multiple-nodejs-versions:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18,20,22]
        steps:
            - name: checkout code
              uses: actions/checkout@v4 
            - name: steupNodejs version
              uses: actions/setup-node@v4 
              with:
                node-version: ${{ matrix.node-version }} 
            - name: run node js app
              run: node index.js
